name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Run tests (pytest)
        run: pytest

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pharmagent
          POSTGRES_PASSWORD: pharmagent_pass
          POSTGRES_DB: pharmagent_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pharmagent -d pharmagent_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations (upgrade head)
        env:
          DATABASE_URL: postgresql+asyncpg://pharmagent:pharmagent_pass@localhost:5432/pharmagent_db
        run: alembic upgrade head

      - name: Verify downgrade round-trip
        env:
          DATABASE_URL: postgresql+asyncpg://pharmagent:pharmagent_pass@localhost:5432/pharmagent_db
        run: |
          alembic downgrade base
          alembic upgrade head
