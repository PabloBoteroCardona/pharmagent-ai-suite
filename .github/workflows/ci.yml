name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint (ruff check)
        run: ruff check .

      - name: Format check (ruff format)
        run: ruff format --check .

      - name: Run tests with coverage (pytest-cov)
        run: pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=85

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests (Vitest)
        run: npm test

      - name: Type-check and build
        run: npm run build

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pharmagent
          POSTGRES_PASSWORD: pharmagent_pass
          POSTGRES_DB: pharmagent_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pharmagent -d pharmagent_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply migrations (upgrade head)
        env:
          DATABASE_URL: postgresql+asyncpg://pharmagent:pharmagent_pass@localhost:5432/pharmagent_db
        run: alembic upgrade head

      - name: Run repository tests against real Postgres
        env:
          DATABASE_URL: postgresql+asyncpg://pharmagent:pharmagent_pass@localhost:5432/pharmagent_db
        run: pytest -m postgres tests/integration/test_drug_repository_postgres.py tests/integration/test_prescription_record_repository_postgres.py

      - name: Verify downgrade round-trip
        env:
          DATABASE_URL: postgresql+asyncpg://pharmagent:pharmagent_pass@localhost:5432/pharmagent_db
        run: |
          alembic downgrade base
          alembic upgrade head
