name: Keep Supabase alive

# Supabase pausa los proyectos del free tier tras 7 días sin actividad en la base de
# datos. Este job ejecuta una query trivial cada 3 días para que nunca se cumpla ese
# umbral. No corre en push/pull_request porque no tiene relación con el código.
on:
  schedule:
    - cron: "0 8 */3 * *" # cada 3 días a las 08:00 UTC
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base de datos
        env:
          PGSSLMODE: require
          # Pasado por variable de entorno (no interpolado directamente en `run:`) para que
          # bash no reinterprete caracteres especiales de shell ($, backticks...) que pueda
          # contener la contraseña.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        # `tr -d` quita cualquier salto de línea/retorno de carro que se haya colado al
        # guardar el secreto en GitHub (p. ej. un pegado con un \n final) — de lo contrario
        # rompe el último componente de la URI (el nombre de la base de datos).
        run: psql "$(printf '%s' "$SUPABASE_DB_URL" | tr -d '\n\r')" -c "select 1;"
