name: Dependency audit

# Job separado de ci.yml (no de push/pull_request): revisa vulnerabilidades conocidas en
# las dependencias ya fijadas (requirements.txt, package-lock.json) sin depender de que
# alguien pregunte "¿qué falta de la auditoría" — se ejecuta solo (cron semanal) o a
# petición (workflow_dispatch), nunca en cada commit, porque su objetivo es detectar CVEs
# publicadas después del último cambio de código, no revisar el código en sí.
on:
  schedule:
    - cron: "0 6 * * 1" # todos los lunes a las 06:00 UTC
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pip-audit

      - name: Run pip-audit
        run: pip-audit -r requirements.txt

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high
