# Configuración genérica para una única base de datos.

[alembic]
# Ruta a los scripts de migración.
# Es una ruta típicamente en formato POSIX (p. ej. barras inclinadas), relativa al token
# %(here)s, que hace referencia a la ubicación de este archivo .ini
script_location = %(here)s/migrations

# Plantilla usada para generar los nombres de los archivos de migración; el valor por
# defecto es %%(rev)s_%%(slug)s
# Descomentar la línea de abajo para anteponer fecha y hora a los archivos
# ver https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# para ver todos los tokens disponibles
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
# O organizar en subdirectorios por fecha (requiere recursive_version_locations = true)
# file_template = %%(year)d/%%(month).2d/%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s

# Ruta de sys.path que se antepondrá a sys.path si está presente.
# Por defecto es el directorio de trabajo actual. Para varias rutas, el separador
# lo define "path_separator" más abajo.
prepend_sys_path = .

# Zona horaria a usar al renderizar la fecha dentro del archivo de migración
# y en el nombre del archivo.
# Si se especifica, requiere la librería tzdata, instalable añadiendo
# `alembic[tz]` a las dependencias de pip.
# El valor de la cadena se pasa a ZoneInfo()
# dejar en blanco para usar la hora local
# timezone =

# longitud máxima de caracteres a aplicar al campo "slug"
# truncate_slug_length = 40

# poner en 'true' para ejecutar el entorno durante
# el comando 'revision', independientemente de autogenerate
# revision_environment = false

# poner en 'true' para permitir que archivos .pyc y .pyo sin un .py fuente
# se detecten como revisiones en el directorio versions/
# sourceless = false

# especificación de la ubicación de las versiones; por defecto es
# <script_location>/versions. Al usar varios directorios de versiones,
# las revisiones iniciales deben especificarse con --version-path.
# El separador de rutas usado aquí debe ser el especificado por "path_separator"
# más abajo.
# version_locations = %(here)s/bar:%(here)s/bat:%(here)s/alembic/versions

# path_separator; indica qué carácter se usa para separar listas de rutas de archivo,
# incluyendo version_locations y prepend_sys_path dentro de archivos configparser
# como alembic.ini.
# El valor por defecto en los alembic.ini nuevos es "os", que usa os.pathsep
# para separar rutas según el sistema operativo.
#
# Nota: para dar soporte a archivos alembic.ini heredados, este valor por defecto NO
# se aplica si path_separator no está presente en alembic.ini. Si esta
# opción se omite por completo, la lógica de respaldo es la siguiente:
#
# 1. El parseo de la opción version_locations recurre a la clave heredada
#    "version_path_separator", que si está ausente recurre al comportamiento
#    heredado de separar por espacios y/o comas.
# 2. El parseo de la opción prepend_sys_path recurre al comportamiento
#    heredado de separar por espacios, comas o dos puntos.
#
# Valores válidos para path_separator son:
#
# path_separator = :
# path_separator = ;
# path_separator = space
# path_separator = newline
#
# Usar os.pathsep. Configuración por defecto para proyectos nuevos.
path_separator = os


# poner en 'true' para buscar archivos fuente recursivamente
# en cada directorio de "version_locations"
# nuevo en Alembic 1.10
# recursive_version_locations = false

# la codificación de salida usada al escribir los archivos de revisión
# generados a partir de script.py.mako
# output_encoding = utf-8

# URL de la base de datos. Solo la consume el script env.py mantenido por el usuario.
# otras formas de configurar la URL de la base de datos pueden personalizarse dentro
# del archivo env.py
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]
# post_write_hooks define scripts o funciones Python que se ejecutan
# sobre los scripts de revisión recién generados. Ver la documentación para más
# detalle y ejemplos

# formatear con "black" - usar el runner de console_scripts, contra el entrypoint "black"
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# lint intentando corregir con "ruff" - usar el runner de módulo, contra el módulo "ruff"
# hooks = ruff
# ruff.type = module
# ruff.module = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# Alternativamente, usar el runner exec para ejecutar un binario del PATH
# hooks = ruff
# ruff.type = exec
# ruff.executable = ruff
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

# Configuración de logging. También la consume solo el script env.py mantenido
# por el usuario.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
