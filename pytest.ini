[pytest]
pythonpath = .
asyncio_mode = auto
addopts = -m "not postgres"
markers =
    postgres: requiere un Postgres real accesible en settings.database_url (excluido por defecto; ver tests/integration/test_drug_repository_postgres.py)
filterwarnings =
    ignore:'asyncio.get_event_loop_policy' is deprecated:DeprecationWarning
    ignore:'asyncio.set_event_loop_policy' is deprecated:DeprecationWarning
