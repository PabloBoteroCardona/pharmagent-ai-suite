services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pharmagent_postgres
    # Sin publicar al host: dentro de este compose, `api` resuelve `postgres` por nombre en
    # la red interna de Docker — no necesita el puerto publicado, y publicarlo expondría
    # Postgres directamente en la máquina host sin necesidad. `docker-compose.override.yml`
    # (cargado automáticamente en local, ver ese archivo) lo vuelve a publicar solo para
    # desarrollo (conectar un cliente SQL, correr la API fuera de Docker).
    environment:
      POSTGRES_USER: pharmagent
      POSTGRES_PASSWORD: pharmagent_pass
      POSTGRES_DB: pharmagent_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmagent -d pharmagent_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: pharmagent_ollama
    # Ver comentario de `postgres.ports` arriba — mismo motivo, mismo mecanismo de override.
    volumes:
      - ollama_data:/root/.ollama

  api:
    build: .
    container_name: pharmagent_api
    ports:
      - "8000:8000"
    # Endurecimiento del contenedor propio (imagen que controlamos, a diferencia de
    # `postgres`/`ollama`): sin escritura en el sistema de ficheros raíz (el código es
    # estático, `PYTHONDONTWRITEBYTECODE=1` ya evita el único escrito habitual, `.pyc`) y sin
    # ninguna capability Linux — ya corre como usuario sin privilegios (`USER pharmagent` en
    # el Dockerfile) y no necesita ninguna (p. ej. no liga un puerto <1024). `/tmp` como
    # tmpfs por margen de seguridad, para lo que pueda necesitar escritura temporal
    # (`tempfile`, etc.) sin relajar `read_only`.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    env_file:
      - .env
    environment:
      # Dentro de la red de Docker Compose los servicios se resuelven por nombre, no por
      # localhost/127.0.0.1 ni por el puerto publicado al host — se sobrescriben aquí los
      # valores de `.env` (pensados para ejecutar la API fuera de Docker).
      DATABASE_URL: postgresql+asyncpg://pharmagent:pharmagent_pass@postgres:5432/pharmagent_db
      OLLAMA_BASE_URL: http://ollama:11434
    # Sin `command:` — usa el `CMD` del propio Dockerfile (migra y arranca Uvicorn), igual
    # que cualquier otra plataforma que solo sepa ejecutar la imagen (Render, Cloud Run).
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  postgres_data:
  ollama_data:
