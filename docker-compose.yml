services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pharmagent_postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: pharmagent
      POSTGRES_PASSWORD: pharmagent_pass
      POSTGRES_DB: pharmagent_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmagent -d pharmagent_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: pharmagent_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  ollama_data:
