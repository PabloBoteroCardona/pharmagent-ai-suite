<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PharmAgent</title>
    <meta
      name="description"
      content="Asistencia farmacológica clínica potenciada por IA, con datos oficiales de CIMA/AEMPS."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22 font-size=%2280%22><text y=%22.9em%22>💊</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen bg-slate-50 text-slate-900 antialiased">
    <div class="flex min-h-screen flex-col md:flex-row">
      <!-- Barra superior (móvil) -->
      <header
        class="flex items-center justify-between border-b border-slate-800 bg-slate-900 px-4 py-3 md:hidden"
      >
        <div class="flex items-center gap-2 text-white">
          <span class="text-xl">🧬</span>
          <span class="text-lg font-extrabold tracking-tight">PharmAgent</span>
        </div>
        <button
          id="sidebar-toggle"
          type="button"
          class="rounded-lg border border-slate-700 p-2 text-slate-200"
          aria-label="Abrir menú"
          aria-expanded="false"
        >
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" />
          </svg>
        </button>
      </header>

      <!-- Sidebar -->
      <aside
        id="sidebar"
        class="hidden w-full flex-col gap-6 border-b border-slate-800 bg-slate-900 p-6 text-slate-200 md:flex md:w-80 md:shrink-0 md:border-b-0 md:border-r"
      >
        <div class="hidden items-center gap-2 md:flex">
          <span class="text-2xl">🧬</span>
          <div>
            <p class="text-lg font-extrabold tracking-tight text-white">PharmAgent</p>
            <p class="text-xs text-slate-400">Asistencia clínica con trazabilidad AEMPS</p>
          </div>
        </div>

        <section>
          <h2 class="mb-2 text-xs font-semibold uppercase tracking-wider text-slate-400">
            Estado de conexión
          </h2>
          <div id="status-list" class="space-y-1.5 text-sm"></div>
          <button
            id="status-refresh"
            type="button"
            class="mt-3 w-full rounded-lg border border-slate-700 bg-slate-800 px-3 py-1.5 text-xs font-semibold text-slate-200 transition hover:border-sky-500 hover:text-white"
          >
            🔄 Comprobar backend
          </button>
        </section>

        <section class="flex min-h-0 flex-1 flex-col">
          <div class="mb-2 flex items-center justify-between">
            <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400">
              Búsquedas recientes
            </h2>
            <button id="history-clear" type="button" class="text-xs text-slate-500 hover:text-slate-300">
              Limpiar
            </button>
          </div>
          <div id="history-list" class="max-h-72 space-y-1 overflow-y-auto text-sm"></div>
        </section>

        <p class="text-xs text-slate-500">Fuente clínica: CIMA (AEMPS) · TFM PharmAgent</p>
      </aside>

      <!-- Contenido principal -->
      <main class="flex-1 px-4 py-6 md:px-10 md:py-8">
        <div class="mx-auto max-w-4xl">
          <h1 class="hidden text-2xl font-extrabold tracking-tight text-slate-900 md:block">PharmAgent</h1>
          <p class="hidden text-sm text-slate-500 md:block">
            Asistencia farmacológica clínica potenciada por IA, con datos oficiales de CIMA/AEMPS.
          </p>

          <nav class="mt-6 flex gap-1 rounded-xl bg-slate-200/60 p-1" role="tablist" aria-label="Secciones">
            <button data-tab="consult" class="tab-button" role="tab" aria-selected="true">
              💬 Consulta Clínica
            </button>
            <button data-tab="interactions" class="tab-button" role="tab" aria-selected="false">
              🛡️ Interacciones
            </button>
            <button data-tab="prescription" class="tab-button" role="tab" aria-selected="false">
              📋 Receta
            </button>
          </nav>

          <!-- Vista: Consulta Clínica -->
          <section id="view-consult" data-view class="mt-6 space-y-5">
            <form
              id="consult-form"
              class="space-y-3 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm"
            >
              <div>
                <label for="consult-drug-name" class="text-xs font-semibold text-slate-500">
                  Nombre del fármaco (opcional, acota la búsqueda en CIMA solo para tu próxima pregunta)
                </label>
                <input
                  id="consult-drug-name"
                  type="text"
                  placeholder="Ej. Naproxeno"
                  class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-100"
                />
              </div>
              <div class="flex items-end gap-2">
                <div class="flex-1">
                  <label for="consult-query" class="text-xs font-semibold text-slate-500">
                    Tu consulta clínica
                  </label>
                  <input
                    id="consult-query"
                    type="text"
                    required
                    placeholder="¿Qué interacciones críticas existen entre Amiodarona y Warfarina?"
                    class="mt-1 w-full rounded-lg border border-slate-200 px-3 py-2.5 text-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-100"
                  />
                </div>
                <button
                  type="submit"
                  class="shrink-0 rounded-lg bg-sky-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-sky-700"
                >
                  Preguntar
                </button>
              </div>
            </form>

            <div id="consult-results" class="space-y-4"></div>
          </section>

          <!-- Vista: Verificador de Interacciones -->
          <section id="view-interactions" data-view class="mt-6 hidden space-y-5">
            <form
              id="interactions-add-form"
              class="flex gap-2 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm"
            >
              <input
                id="interactions-drug-input"
                type="text"
                placeholder="Nombre del fármaco"
                class="flex-1 rounded-lg border border-slate-200 px-3 py-2 text-sm focus:border-sky-500 focus:outline-none focus:ring-2 focus:ring-sky-100"
              />
              <button
                type="submit"
                class="rounded-lg bg-slate-800 px-4 py-2 text-sm font-semibold text-white transition hover:bg-slate-700"
              >
                ➕ Añadir
              </button>
            </form>

            <div id="interactions-drug-chips" class="flex flex-wrap gap-2"></div>

            <button
              id="interactions-check-button"
              type="button"
              disabled
              class="w-full rounded-lg bg-sky-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-sky-700 disabled:cursor-not-allowed disabled:bg-slate-300"
            >
              🛡️ Verificar interacciones
            </button>

            <div id="interactions-results" class="space-y-4"></div>
          </section>

          <!-- Vista: Flujo Asistencial (Receta) -->
          <section id="view-prescription" data-view class="mt-6 hidden space-y-5">
            <form
              id="prescription-form"
              class="space-y-3 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm"
            >
              <div>
                <label for="prescription-file" class="text-xs font-semibold text-slate-500">
                  Foto de la receta
                </label>
                <input
                  id="prescription-file"
                  type="file"
                  accept="image/png,image/jpeg,image/webp"
                  class="mt-1 block w-full text-sm text-slate-600 file:mr-3 file:rounded-lg file:border-0 file:bg-sky-50 file:px-3 file:py-2 file:text-sm file:font-semibold file:text-sky-700 hover:file:bg-sky-100"
                />
              </div>
              <img
                id="prescription-preview"
                class="hidden max-h-64 rounded-lg border border-slate-200 object-contain"
                alt="Vista previa de la receta"
              />
              <button
                id="prescription-submit"
                type="submit"
                disabled
                class="w-full rounded-lg bg-sky-600 px-4 py-2.5 text-sm font-semibold text-white transition hover:bg-sky-700 disabled:cursor-not-allowed disabled:bg-slate-300"
              >
                🔎 Procesar receta
              </button>
            </form>

            <div id="prescription-results" class="space-y-4"></div>
          </section>
        </div>
      </main>
    </div>

    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
